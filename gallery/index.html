<!doctype html>
<html lang="en">
<head>
  <!-- @head -->
  <title>Gallery — Inside the World of Principle Adhesives</title>
  <meta name="description" content="Product photography of the Prince range by Principle Adhesives — Princecol, Prince Bond, Prince Lite, Prince Glu and Prince Grip drums, buckets and pouches." />
  <meta property="og:title" content="Inside the world of Principle Adhesives — Gallery" />
</head>
<body data-page="gallery">
  <!-- @chrome -->
  <!-- @nav:gallery -->

  <main id="main">
    <section class="phero phero--gallery" id="top" aria-labelledby="pTitle">
      <div class="gal-hero__float" aria-hidden="true" id="galFloat"></div>
      <div class="phero__body">
        <p class="mono eyebrow" data-hero-in>Gallery — a closer look at our world</p>
        <h1 class="phero__title" id="pTitle" data-split>Inside the world of Principle Adhesives.</h1>
        <div class="phero__foot">
          <p class="phero__lede" data-hero-in>The Prince range, up close — drums, buckets and pouches as they leave our factory.</p>
          <p class="mono phero__count" data-hero-in><b id="galCount">16</b> images</p>
        </div>
      </div>
      <div class="hero__scroll mono" aria-hidden="true"><span>Scroll</span><i></i></div>
    </section>

    <section class="gal section" aria-labelledby="gTitle">
      <h2 class="visually-hidden" id="gTitle">Image gallery</h2>
      <div class="gal__bar">
        <div class="finder__chips" role="group" aria-label="Filter images" id="galFilters"></div>
        <div class="gal__prod finder__chips" role="group" aria-label="Filter by product" id="galProducts"></div>
      </div>
      <ul class="gal__grid" id="galGrid"></ul>
    </section>

    <!-- @cta {"eyebrow":"Next","title":"See the full Prince range.","primary":{"label":"Explore Products","href":"/products/"},"secondary":{"label":"Contact Us","href":"/contact/"}} -->
  </main>

  <!-- @footer -->
  <noscript><style>.curtain{display:none}</style></noscript>
  <script type="module" src="/src/pages/gallery.js"></script>
</body>
</html>
